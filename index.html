<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merienda:wght@300..900&family=Playwrite+DE+Grund:wght@100..400&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Stylish&display=swap"
        rel="stylesheet">
    <title>Promodoro Timer</title>
    <link rel="stylesheet" href="assets/style.css">
    <script src="script/script.js" defer></script>

</head>

<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-heading">
                <span class="nav-heading-icon"></span>
                <h2>Stay Focused</h2>
            </div>
            <ul class="nav-buttons">
                <li class="reports"></li>
                <li class="settings"></li>
                <li class="profile"></li>
                <li class="three-dot-menu"></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="timer">
            <div class="time-limit">
                <button class="promodoro">Promodoro</button>
                <button class="short-break">Short Break</button>
                <button class="long-break">Long Break</button>
            </div>
            <div class="time-countdown">00:00</div>
            <button class="start-countdown-button">START</button>
        </section>

        <section id="task">
            <div class="current-task">
                <div class="running-task-heading">Running Task:</div>
                <div class="running-task">No task is running currently!</div>
            </div>
            <div class="add-task">
                <span class="add-task-icon"></span>
                <p>Add Task</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-links">
            <div class="faq">FAQ</div>
            <div class="privacy">PRIVACY</div>
            <div class="terms">TERMS</div>
            <div class="contact">CONTACT</div>
        </div>

        <div class="footer-copyrights">
            &copy;Stay Focused 2024. All Rights Reserved.
        </div>
    </footer>


</body>

</html>
